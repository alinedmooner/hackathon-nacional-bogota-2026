version: '3.8'

services:
  mongo:
    image: mongo:6
    volumes:
      - mongo_data:/data/db
    networks:
      - backend
    ports:
      - 27017:27017
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      placement:
        constraints:
          - node.role == manager

  api:
    image: hackathon5/api:latest
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=60
      - CORS_ORIGINS=*
      - DATASET_CONTRATOS_ID=jbjy-vk9h
      - DATASET_ARCHIVOS_ID=dmgg-8hin
      - PARQUET_PATH=/app/data/contratos.parquet
    networks:
      - backend
      - reverse_proxy
    depends_on:
      - mongo
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=reverse_proxy"
        - "traefik.http.routers.hackathon5-api.entrypoints=websecure"
        - "traefik.http.routers.hackathon5-api.tls=true"
        - "traefik.http.routers.hackathon5-api.tls.certresolver=production"
        - "traefik.http.routers.hackathon5-api.rule=Host(`gludsitohackathon5back.glud.org`)"
        - "traefik.http.routers.hackathon5-api.service=hackathon5-api"
        - "traefik.http.services.hackathon5-api.loadbalancer.server.port=8000"

volumes:
  mongo_data:

networks:
  backend:
    driver: overlay
    external: true
  reverse_proxy:
    driver: overlay
    external: true
