version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      network: host
    image: hackathon5/api:latest
    container_name: api
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    volumes:
      - ./api/data:/app/data
    env_file:
      - ./api/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-cambia-esto-en-produccion}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=60
      - CORS_ORIGINS=*
      - DATASET_CONTRATOS_ID=jbjy-vk9h
      - DATASET_ARCHIVOS_ID=dmgg-8hin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      network: host
    image: hackathon5/web:latest
    environment:
      - BACKEND_URL=https://gludsitohackathon5back.glud.org

volumes:
  mongo_data:
    driver: local
