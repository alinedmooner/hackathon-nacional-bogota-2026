version: '3.8'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-cambia-esto-en-produccion}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=60
      - CORS_ORIGINS=http://localhost:4200,http://localhost:80
      - DATASET_CONTRATOS_ID=jbjy-vk9h
      - DATASET_ARCHIVOS_ID=dmgg-8hin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
