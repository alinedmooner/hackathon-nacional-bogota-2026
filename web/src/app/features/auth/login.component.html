<section class="mx-auto mt-10 w-full max-w-md">
  <div class="rounded border-t-4 border-navy bg-card shadow-sm">
    <div class="px-7 pt-7 pb-6">
      <div class="flex items-center gap-3">
        <div class="flex h-12 w-12 items-center justify-center rounded bg-navy font-editorial text-2xl font-semibold text-cream shadow-[inset_0_-3px_0_var(--gold)]">
          V
        </div>
        <div>
          <p class="eyebrow">Acceso</p>
          <h2 class="font-editorial text-2xl font-semibold leading-none text-ink">
            Verid<span class="text-navy">IA</span>
          </h2>
        </div>
      </div>

      <p class="mt-5 text-sm leading-relaxed text-ink-2">
        Ingresa con tus credenciales para acceder al panel de inteligencia anticorrupción.
      </p>

      <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()">
        <div>
          <label class="eyebrow">Usuario</label>
          <input
            class="mt-2 w-full rounded border border-line-strong bg-cream px-4 py-2.5 text-sm text-ink placeholder-muted focus:border-navy focus:outline-none focus:ring-1 focus:ring-navy"
            type="text"
            formControlName="username"
            placeholder="admin"
          />
        </div>

        <div>
          <label class="eyebrow">Contraseña</label>
          <input
            class="mt-2 w-full rounded border border-line-strong bg-cream px-4 py-2.5 text-sm text-ink placeholder-muted focus:border-navy focus:outline-none focus:ring-1 focus:ring-navy"
            type="password"
            formControlName="password"
            placeholder="••••••••"
          />
        </div>

        <label class="flex items-center gap-2 text-xs text-ink-2">
          <input
            class="h-4 w-4 accent-navy"
            type="checkbox"
            formControlName="remember"
          />
          Recordar sesión en este dispositivo
        </label>

        <button
          type="submit"
          class="btn-primary w-full"
          [disabled]="loading"
        >
          {{ loading ? "Conectando…" : "Entrar" }}
        </button>

        <p
          *ngIf="error"
          class="rounded border border-err/30 bg-err/10 p-3 text-sm text-err"
        >
          {{ error }}
        </p>
      </form>
    </div>

    <div class="border-t border-line bg-cream-2 px-7 py-4">
      <p class="eyebrow">Credenciales demo</p>
      <p class="mt-1 text-sm text-ink-2">
        Usuario: <span class="font-mono font-semibold text-navy tabular">admin</span>
        · Contraseña: <span class="font-mono font-semibold text-navy tabular">admin123</span>
      </p>
    </div>
  </div>

  <div class="mt-6 grid gap-3">
    <div class="rounded border-l-4 border-gold bg-card p-4">
      <p class="eyebrow">Backend activo</p>
      <p class="mt-1 break-all font-mono text-xs text-ink-2 tabular">{{ backendUrl }}</p>
      <a
        class="mt-2 inline-flex items-center gap-1 text-xs font-semibold text-navy hover:text-navy-light"
        [href]="'https://gludsitohackathon5back.glud.org/docs'"
        target="_blank"
        rel="noopener"
      >
        Ver documentación (Swagger)
        <span aria-hidden="true">→</span>
      </a>
    </div>
  </div>
</section>
