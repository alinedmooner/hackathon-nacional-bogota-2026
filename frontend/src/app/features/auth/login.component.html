<section class="panel neon-ring mx-auto mt-6 w-full max-w-md rounded-2xl p-6 md:p-8">
  <div class="mb-6">
    <p class="text-xs uppercase tracking-[0.35em] text-violet-400">Access</p>
    <h2 class="text-2xl font-semibold text-slate-100">Iniciar sesion</h2>
    <p class="mt-2 text-sm text-slate-400">Accede con tu JWT para entrar al dashboard.</p>
  </div>

  <form class="space-y-5" [formGroup]="form" (ngSubmit)="submit()">
    <div>
      <label class="text-xs uppercase tracking-widest text-slate-400">Usuario</label>
      <input
        class="mt-2 w-full rounded-lg border border-slate-700 bg-terminal-900/80 px-4 py-3 text-sm text-slate-100 focus:border-neon-400 focus:outline-none"
        type="text"
        formControlName="username"
        placeholder="admin"
      />
    </div>

    <div>
      <label class="text-xs uppercase tracking-widest text-slate-400">Password</label>
      <input
        class="mt-2 w-full rounded-lg border border-slate-700 bg-terminal-900/80 px-4 py-3 text-sm text-slate-100 focus:border-neon-400 focus:outline-none"
        type="password"
        formControlName="password"
        placeholder="••••••••"
      />
    </div>

    <label class="flex items-center gap-3 text-xs text-slate-400">
      <input class="h-4 w-4 accent-neon-400" type="checkbox" formControlName="remember" />
      Recordar sesion en este dispositivo
    </label>

    <button
      type="submit"
      class="w-full rounded-lg bg-neon-500 px-4 py-3 text-sm font-semibold text-slate-900 transition hover:bg-neon-400"
      [disabled]="loading"
    >
      {{ loading ? 'Conectando...' : 'Entrar al sistema' }}
    </button>

    <p *ngIf="error" class="rounded-lg border border-red-400/30 bg-red-500/10 p-3 text-sm text-red-200">
      {{ error }}
    </p>
  </form>

  <div class="mt-6 text-xs text-slate-500">
    <span>Backend activo en </span>
    <span class="text-neon-400">assets/env.js</span>
  </div>
</section>
